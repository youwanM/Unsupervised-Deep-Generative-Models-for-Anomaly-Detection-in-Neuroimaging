<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsupervised Deep Generative Models for Anomaly Detection in Neuroimaging</title>
    
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS for interactivity -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <style>
        body { padding: 2rem; background-color: #f8f9fa; }
        .table-container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th { white-space: nowrap; }
    </style>
</head>
<body>

<div class="container-fluid table-container">
    <h2 class="mb-4">Unsupervised Deep Generative Models for Anomaly Detection in Neuroimaging</h2>
    
    <!-- Custom Filters -->
    <div class="row mb-3">
        <div class="col-md-5">
            <label for="diseaseFilter" class="form-label"><strong>Filter by Disease:</strong></label>
            <select id="diseaseFilter" class="form-select">
                <option value="">All Diseases</option>
                <option value="Brain Tumours">Brain Tumours</option>
                <option value="Stroke (Acute and Chronic)">Stroke (Acute and Chronic)</option>
                <option value="Multiple Sclerosis (MS) and White Matter Hyperintensities (WMH)">Multiple Sclerosis (MS) and White Matter Hyperintensities (WMH)</option>
                <option value="Traumatic Brain Injury (TBI)">Traumatic Brain Injury (TBI)</option>
            </select>
        </div>
        <div class="col-md-4">
            <label for="archFilter" class="form-label"><strong>Filter by Architecture:</strong></label>
            <select id="archFilter" class="form-select">
                <option value="">All Architectures</option>
                <option value="AE">Autoencoders (AE)</option>
                <option value="VAE">VAEs</option>
                <option value="GAN">GANs</option>
                <option value="Diff.">Diffusion</option>
            </select>
        </div>
    </div>

    <!-- Interactive Table -->
    <table id="modelTable" class="table table-striped table-hover table-bordered w-100">
        <thead class="table-dark">
            <tr>
                <th>Disease</th>
                <th>Method</th>
                <th>Arch.</th>
                <th>Train Dataset</th>
                <th>Test Dataset</th>
                <th>Modality</th>
                <th>Input Dim.</th>
                <th>Dice</th>
                <th>Thresh. Strategy</th>
                <th>AUROC</th>
                <th>AUPRC</th>
                <th>Eval Level</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be injected here via JavaScript -->
        </tbody>
    </table>
</div>

<!-- jQuery and DataTables JS dependencies -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
    $(document).ready(function() {
        // Initialize DataTable to read directly from your new JSON file via AJAX
        var table = $('#modelTable').DataTable({
            ajax: {
                url: 'data.json',   // Points to the file generated by your Python script
                dataSrc: ''         // Tells DataTables the JSON is a flat array
            },
           columns: [
                { data: 'disease' },
                { 
                    data: 'method',
                    render: function(data, type, row) {
                        if (row.url && row.url !== "") {
                            return '<a href="' + row.url + '" target="_blank" style="text-decoration: none; font-weight: bold;">' + data + '</a>';
                        }
                        return data;
                    }
                },
                { data: 'arch' },
                { data: 'trainData' },
                { data: 'testData' },
                { data: 'modality' },
                { data: 'inputDim' }, // NEW COLUMN
                { data: 'dice' },
                { data: 'threshStrategy' }, // NEW COLUMN
                { data: 'auroc' },
                { data: 'auprc' },
                { data: 'evalLevel' },
                { data: 'notes' } // NEW COLUMN
            ],
            pageLength: 75,
            responsive: true,
            order: [[1, 'asc']] // Optionally sort by Method name by default
        });

        // Add event listeners to custom dropdown filters
        $('#diseaseFilter').on('change', function() {
            // Use regex (true, false) for exact matches on the selected string
            table.column(0).search(this.value ? '^' + $.fn.dataTable.util.escapeRegex(this.value) + '$' : '', true, false).draw();
        });

        $('#archFilter').on('change', function() {
            table.column(2).search(this.value).draw();
        });
    });
</script>

</body>
</html>
